name: Release

on:
  push:
    tags: ['v*']

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    uses: ./.github/workflows/build.yml

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v8

      - name: Collect artifacts
        run: mv */*.zip */*.tar.xz .

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ASSETS=(*.zip *.tar.xz)
          if gh release view "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" &>/dev/null; then
            gh release upload "$GITHUB_REF_NAME" "${ASSETS[@]}" --clobber -R "$GITHUB_REPOSITORY"
          else
            gh release create "$GITHUB_REF_NAME" "${ASSETS[@]}" --prerelease --title "$GITHUB_REF_NAME" --notes "" -R "$GITHUB_REPOSITORY"
          fi
